{{ define "header" }}
<!-- Mobile Top Header Bar (Mobile screens < 768px) -->
<header class="mobile-top-bar" aria-label="Mobile Header">
    <a href="/index.html" class="mobile-logo-link">
        <img src="/acmshortlogo.png" alt="ACM PESU ECC Logo" class="mobile-logo-img" />
        <span class="mobile-logo-text">ACM PESU ECC</span>
    </a>
    <button id="mobile-nav-toggle" class="mobile-hamburger-btn" aria-label="Open Navigation Menu" aria-expanded="false" aria-controls="sidebar-nav">
        <svg class="hamburger-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>
</header>

<!-- Backdrop Overlay for expanded mobile / tablet sidebar -->
<div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

<!-- Vertical Left Sidebar Navigation -->
<aside id="sidebar-nav" class="sidebar-nav" aria-label="Main Navigation">
    <div class="sidebar-header">
        <a href="/index.html" class="sidebar-brand">
            <img src="/acmshortlogo.png" alt="ACM Logo" class="sidebar-logo" />
            <div class="sidebar-brand-text">
                <span class="sidebar-brand-title">ACM PESUECC</span>
                <span class="sidebar-brand-subtitle">Student Chapter</span>
            </div>
        </a>
        <button id="sidebar-close-btn" class="sidebar-close-btn" aria-label="Close Navigation Menu">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <!-- Medium screen expand/collapse trigger button -->
    <button id="sidebar-rail-toggle" class="sidebar-rail-toggle" aria-label="Toggle Sidebar Menu" title="Expand menu">
        <svg class="rail-toggle-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="13 17 18 12 13 7"></polyline>
            <polyline points="6 17 11 12 6 7"></polyline>
        </svg>
    </button>

    <nav class="sidebar-nav-container">
        <ul class="nav-list">
            <li class="nav-item">
                <a href="/index.html" class="nav-link" data-url="index.html">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                    </span>
                    <span class="nav-label">Home</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/about.html" class="nav-link" data-url="about.html">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                    </span>
                    <span class="nav-label">About</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/collections/posts.html" class="nav-link" data-url="collections/posts.html">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                            <line x1="8" y1="7" x2="16" y2="7"></line>
                            <line x1="8" y1="11" x2="14" y2="11"></line>
                        </svg>
                    </span>
                    <span class="nav-label">Blog / Posts</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/aiep.html" class="nav-link" data-url="aiep.html">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                    </span>
                    <span class="nav-label">AIEP</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/tags.html" class="nav-link" data-url="tags.html">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                            <line x1="7" y1="7" x2="7.01" y2="7"></line>
                        </svg>
                    </span>
                    <span class="nav-label">Tags</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/hn7-faq.html" class="nav-link" data-url="hn7-faq.html">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </span>
                    <span class="nav-label">HN7 FAQ</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="sidebar-bottom">
        <!-- Theme Switcher Button -->
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Switch Light / Dark Theme" title="Toggle theme">
            <span class="theme-icon sun-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </span>
            <span class="theme-icon moon-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </span>
            <span class="theme-label">Theme</span>
        </button>

        <!-- Social Icons Row -->
        <div class="sidebar-socials">
            <a href="https://github.com/acmpesuecc" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
                <img src="/github.png" alt="GitHub" class="social-icon-img" />
            </a>
            <a href="https://www.linkedin.com/company/acm-pesu-ecc/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
                <img src="/linkedin.png" alt="LinkedIn" class="social-icon-img" />
            </a>
            <a href="https://www.instagram.com/acmpesuecc" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
                <img src="/instagram.svg" alt="Instagram" class="social-icon-img" />
            </a>
            <a href="https://twitter.com/AcmPesu" target="_blank" rel="noopener noreferrer" aria-label="Twitter / X" title="Twitter">
                <img src="/twitter.png" alt="Twitter" class="social-icon-img" />
            </a>
            <a href="mailto:acmpesuecc@pes.edu" aria-label="Email" title="Email us">
                <img src="/mail-64.png" alt="Email" class="social-icon-img" />
            </a>
        </div>
    </div>
</aside>
{{ end }}
