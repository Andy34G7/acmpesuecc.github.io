name: Deploy Anna Site to Pages

on:
  push:
    branches:
      - anna-ssg-migration
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install and Build with Anna SSG
        run: |
          go install github.com/anna-ssg/anna/cmd/anna@latest || go install github.com/acmpesuecc/anna@latest
          anna

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/rendered

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
